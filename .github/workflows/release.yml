name: Release WHOOP Core (AltStore bundle)

# Builds the unsigned .ipa AND the AltStore source bundle (apps.json + icon.png) in one go.
# Run from the Actions tab: provide the public base URL where you'll host the files, then
# download the "WHOOP-Core-altstore-dist" artifact and upload its 3 files to that URL.
# AltStore polls apps.json and offers OTA updates whenever the version bumps.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Public base URL you will host the files under (e.g. https://dl.example.com/whoop)"
        required: true
      version:
        description: "Version (default: package.json version)"
        required: false
      notes:
        description: "What's-new / changelog for this version"
        required: false
        default: ""

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve version
        id: ver
        run: |
          V="${{ inputs.version }}"
          [ -z "$V" ] && V="$(node -p "require('./package.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V"

      - name: Install JS dependencies
        run: npm install

      - name: Bundle web app + generate the iOS project
        run: npm run add:ios

      - name: Add Bluetooth usage descriptions to Info.plist
        working-directory: ios/App/App
        run: |
          PB=/usr/libexec/PlistBuddy
          BT="WHOOP Core uses Bluetooth to read data directly from your WHOOP 5.0 band."
          $PB -c "Add :NSBluetoothAlwaysUsageDescription string '$BT'" Info.plist || $PB -c "Set :NSBluetoothAlwaysUsageDescription '$BT'" Info.plist
          $PB -c "Add :NSBluetoothPeripheralUsageDescription string '$BT'" Info.plist || $PB -c "Set :NSBluetoothPeripheralUsageDescription '$BT'" Info.plist

      - name: Build unsigned archive
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION=${{ steps.ver.outputs.version }} \
            CURRENT_PROJECT_VERSION=1 \
            archive

      - name: Ad-hoc sign + package .ipa
        working-directory: ios/App
        run: |
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          APP=build/Payload/App.app
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 -name "*.framework" -exec codesign --force --sign - {} \;
          fi
          codesign --force --sign - "$APP"
          cd build && zip -qry WHOOP-Core.ipa Payload

      - name: Assemble AltStore dist bundle
        env:
          BASE_URL: ${{ inputs.base_url }}
          REL_VERSION: ${{ steps.ver.outputs.version }}
          REL_NOTES: ${{ inputs.notes }}
        run: |
          mkdir -p dist
          cp ios/App/build/WHOOP-Core.ipa dist/WHOOP-Core.ipa
          node tools/make-icon.mjs dist/icon.png
          node tools/make-altstore-source.mjs \
            --base "$BASE_URL" \
            --version "$REL_VERSION" \
            --ipa dist/WHOOP-Core.ipa \
            --out dist/apps.json \
            --notes "$REL_NOTES"
          echo "----- dist/apps.json -----" && cat dist/apps.json

      - uses: actions/upload-artifact@v4
        with:
          name: WHOOP-Core-altstore-dist
          path: |
            dist/WHOOP-Core.ipa
            dist/apps.json
            dist/icon.png
          if-no-files-found: error
