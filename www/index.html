<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>WHOOP Core</title>
<style>
  :root{
    --void:#04080d; --abyss:#0a1622; --cyan:#38e1ff; --cyan-bright:#bff4ff;
    --cyan-dim:#1c5e72; --amber:#ffb35c; --text:#cfe9f2; --text-dim:#6f93a3;
    --ok:#5cff9d; --bad:#ff6b6b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--void);color:var(--text);
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
    padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));}
  h1{font-size:15px;letter-spacing:3px;text-transform:uppercase;color:var(--cyan);margin:0}
  .sub{color:var(--text-dim);font-size:11px;margin:2px 0 14px}
  .panel{background:var(--abyss);border:1px solid var(--cyan-dim);border-radius:12px;padding:14px;margin-bottom:12px}
  .status{font-family:ui-monospace,monospace;font-size:13px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bad);margin-right:7px;vertical-align:middle}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .vitals{display:flex;gap:12px}
  .vital{flex:1;text-align:center}
  .vital .v{font-family:ui-monospace,monospace;font-size:40px;color:var(--cyan-bright);line-height:1.1}
  .vital .v.sm{font-size:24px}
  .vital .k{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);margin-top:2px}
  .meta{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px;font-family:ui-monospace,monospace}
  .meta .k{color:var(--text-dim)}
  button{background:transparent;color:var(--cyan);border:1px solid var(--cyan);border-radius:8px;
    padding:11px 14px;font:inherit;font-size:13px;letter-spacing:1px;text-transform:uppercase;margin:3px 4px 3px 0}
  button:disabled{opacity:.32}
  button.live{background:var(--ok);color:var(--void);border-color:var(--ok)}
  .row{display:flex;flex-wrap:wrap}
  .in{background:#020509;color:var(--text);border:1px solid var(--cyan-dim);border-radius:8px;
    padding:10px;font:inherit;font-size:13px;font-family:ui-monospace,monospace;flex:1;min-width:84px;margin:3px 4px 3px 0}
  textarea#dump{display:none;width:100%;height:20vh;margin-top:8px;background:#020509;color:var(--text);
    border:1px solid var(--cyan-dim);border-radius:8px;padding:8px;font-family:ui-monospace,monospace;font-size:10px;white-space:pre}
  #log{background:#020509;border:1px solid var(--cyan-dim);border-radius:10px;height:34vh;overflow:auto;
    padding:10px;font-family:ui-monospace,monospace;font-size:11px;white-space:pre-wrap;word-break:break-all}
  .ln{margin:0 0 2px}
  .cmd{color:var(--cyan-bright)} .rx{color:var(--cyan)} .evt{color:var(--amber)}
  .ok{color:var(--ok)} .err{color:var(--bad)} .dim{color:var(--text-dim)}
</style>
</head>
<body>
  <h1>WHOOP Core</h1>
  <div class="sub">standalone reader · WHOOP 5.0 · CoreBluetooth</div>

  <div class="panel"><div class="status"><span id="dot" class="dot"></span><span id="status">Not connected</span></div></div>

  <div class="panel vitals">
    <div class="vital"><div class="v" id="hr">—</div><div class="k">bpm</div></div>
    <div class="vital"><div class="v" id="hrv">—</div><div class="k">HRV rmssd</div></div>
    <div class="vital"><div class="v sm" id="batt">—</div><div class="k">battery</div></div>
  </div>

  <div class="panel meta">
    <span class="k">model</span><span id="model">—</span>
    <span class="k">firmware</span><span id="fw">—</span>
    <span class="k">serial</span><span id="serial">—</span>
    <span class="k">maker</span><span id="mfr">—</span>
  </div>

  <div class="panel">
    <div class="row">
      <button id="connect">Connect</button>
      <button id="hello">get_hello</button>
      <button id="battery">battery</button>
      <button id="range">data_range</button>
      <button id="rthr">Realtime HR: off</button>
      <button id="disconnect">Disconnect</button>
      <button id="clear">Clear</button>
    </div>
    <div class="row" style="margin-top:6px">
      <input id="ccode" class="in" inputmode="numeric" placeholder="cmd # (e.g. 145)">
      <input id="cdata" class="in" placeholder="data hex (e.g. 01)">
      <button id="csend">send</button>
    </div>
  </div>

  <div class="panel">
    <div class="meta"><span class="k">fd4b frames</span><span id="rt">no fd4b frames yet</span></div>
    <div class="row" style="margin-top:8px">
      <button id="capture">Capture: off</button>
      <button id="dumpbtn">Dump capture</button>
    </div>
    <textarea id="dump" readonly></textarea>
  </div>

  <div id="log" class="panel"></div>

  <script src="app.js"></script>
</body>
</html>
